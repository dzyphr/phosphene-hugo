title = 'Phosphene | HomePage'

theme = "gokarna"

# Automatically generate robots.txt
enableRobotsTXT = true

[params]
  description = "Software Development and Releases"
  showPostsOnHomePage = "recent"
  avatarURL = "/humm.png"
  ShowBackToTopButton = true
  metaKeywords = ["blog", "gokarna", "hugo"] #seo
  accentColor = "#8000ff"
  footer = "Phosphene.xyz"
  Hugothememessage = "Powered by Hugo Theme:"
  customHeadHTML = '<link rel="stylesheet" href="/css/custom.css">'
